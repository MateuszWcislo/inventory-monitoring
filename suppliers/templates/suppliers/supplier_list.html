{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-truck me-2"></i>Dostawcy</h2>
    <button class="btn btn-primary"
            hx-get="{% url 'supplier_create' %}"
            hx-target="#modal-content"
            data-bs-toggle="modal"
            data-bs-target="#productModal">
        <i class="bi bi-plus-lg me-2"></i>Dodaj dostawcę
    </button>
</div>

<div id="supplier-table-container"
     hx-get="{% url 'supplier_list' %}"
     hx-trigger="suppliersChanged from:body">
    {% include 'suppliers/partials/supplier_table.html' %}
</div>
{% endblock %}
