{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div class="search-box w-50">
        <div class="input-group">
            <span class="input-group-text bg-white border-end-0">
                <i class="bi bi-search text-muted"></i>
            </span>
            <input type="text"
                   id="search-q"
                   name="q"
                   class="form-control border-start-0"
                   placeholder="Szukaj po nazwie dostawcy..."
                   value="{{ q }}"
                   hx-get="{% url 'supplier_list' %}"
                   hx-trigger="keyup changed delay:500ms"
                   hx-target="#supplier-table-container"
                   hx-push-url="true"
                   hx-include="[name='sort']">
        </div>
    </div>

    <button class="btn btn-primary shadow-sm"
            hx-get="{% url 'supplier_create' %}"
            hx-target="#modal-content"
            data-bs-toggle="modal"
            data-bs-target="#productModal">
        <i class="bi bi-plus-lg me-2"></i>Dodaj dostawcę
    </button>
</div>

<div id="supplier-table-container"
     hx-get="{% url 'supplier_list' %}"
     hx-trigger="suppliersChanged from:body"
     hx-include="#search-q, #current-sort">
    {% include 'suppliers/partials/supplier_table.html' %}
</div>

<input type="hidden" id="current-sort" name="sort" value="{{ sort }}">
{% endblock %}
