<div class="modal-header bg-danger text-white">
    <h5 class="modal-title"><i class="bi bi-exclamation-triangle me-2"></i>Usuń dostawcę</h5>
    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
</div>
<div class="modal-body py-4">
    <p>Czy na pewno chcesz usunąć dostawcę <strong>{{ supplier.name }}</strong>?</p>
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Anuluj</button>
    <form hx-post="{% url 'supplier_delete' supplier.id %}">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Tak, usuń</button>
    </form>
</div>
