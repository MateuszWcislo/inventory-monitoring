<div class="table-responsive bg-white shadow-sm rounded">
    <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
            <tr>
                <th>Nazwa</th>
                <th>NIP</th>
                <th>Telefon</th>
                <th>Adres</th>
                <th class="text-end">Akcje</th>
            </tr>
        </thead>
        <tbody>
            {% for s in suppliers %}
            <tr>
                <td class="fw-bold">{{ s.name }}</td>
                <td>{{ s.nip|default_if_none:"—" }}</td>
                <td>{{ s.phone|default_if_none:"—" }}</td>
                <td class="small text-muted">{{ s.address|truncatechars:30|default_if_none:"—" }}</td>
                <td class="text-end">
                    <button class="btn btn-outline-info btn-sm"
                            hx-get="{% url 'supplier_preview' s.id %}"
                            hx-target="#modal-content"
                            data-bs-toggle="modal"
                            data-bs-target="#supplierModal">
                        <i class="bi bi-eye"></i>
                    </button>
                    <button class="btn btn-sm btn-outline-primary me-1"
                            hx-get="{% url 'supplier_edit' s.id %}"
                            hx-target="#modal-content"
                            data-bs-toggle="modal"
                            data-bs-target="#supplierModal">
                        <i class="bi bi-pencil"></i>
                    </button>
                    <button class="btn btn-sm btn-outline-danger"
                            hx-get="{% url 'supplier_delete' s.id %}"
                            hx-target="#modal-content"
                            data-bs-toggle="modal"
                            data-bs-target="#supplierModal">
                        <i class="bi bi-trash"></i>
                    </button>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="5" class="text-center py-4 text-muted">Brak dostawców w bazie.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
