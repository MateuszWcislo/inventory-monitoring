{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2 class="h4 mb-1 fw-bold text-dark"><i class="bi bi-cart-check me-2"></i>Zamówienia</h2>
        <p class="text-muted small mb-0">Śledź statusy dostaw i zarządzaj zamówieniami do dostawców.</p>
    </div>
    <button class="btn btn-primary shadow-sm"
            hx-get="{% url 'order_create' %}"
            hx-target="#modal-content"
            data-bs-toggle="modal"
            data-bs-target="#productModal">
        <i class="bi bi-plus-lg me-2"></i>Nowe zamówienie
    </button>
</div>

<div class="card border-0 shadow-sm mb-4">
    <div class="card-body">
        <div class="search-box d-flex gap-2">
            <div class="input-group flex-grow-1">
                <span class="input-group-text bg-white border-end-0"><i class="bi bi-search"></i></span>
                <input type="text" name="q" class="form-control border-start-0"
                       placeholder="Szukaj produktu..."
                       hx-get="{% url 'order_list' %}"
                       hx-trigger="keyup changed delay:500ms"
                       hx-target="#order-table-container"
                       hx-include="[name='status']">
            </div>

            <select name="status" class="form-select w-auto"
                    hx-get="{% url 'order_list' %}"
                    hx-target="#order-table-container"
                    hx-include="[name='q']">
                <option value="">Wszystkie statusy</option>
                {% for val, label in status_choices %}
                    <option value="{{ val }}" {% if status_filter == val %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
        </div>
    </div>
</div>

    <div id="order-table-container" hx-get="{% url 'order_list' %}" hx-trigger="ordersChanged from:body, productChanged from:body">
        {% include 'orders/partials/order_table.html' %}
    </div>

{% endblock %}
