<div class="modal-header bg-danger text-white">
    <h5 class="modal-title">Potwierdź usunięcie</h5>
    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
</div>
<div class="modal-body">
    <p>Czy na pewno chcesz usunąć zamówienie <strong>#{{ order.id|stringformat:".8s" }}</strong> od dostawcy <strong>{{ order.supplier.name }}</strong>?</p>
    <p class="text-danger small"><i class="bi bi-exclamation-triangle me-1"></i> Tej operacji nie można cofnąć.</p>
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Anuluj</button>
    <form hx-post="{% url 'order_delete' order.pk %}" hx-target="#order-table-container">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Usuń zamówienie</button>
    </form>
</div>
