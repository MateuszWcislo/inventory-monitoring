<div class="modal-header bg-dark text-white px-4">
    <h5 class="modal-title d-flex align-items-center text-uppercase fs-6 fw-bold">
        <i class="bi bi-cart-plus-fill me-2 text-primary"></i>
        {% if form.instance.pk %}Edycja zamówienia{% else %}Nowe zamówienie ręczne{% endif %}
    </h5>
    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
</div>

<form hx-post="{% if order.id %}{% url 'order_edit' order.id %}{% else %}{% url 'order_create' %}{% endif %}">    {% csrf_token %}
    {{ form.order_type }} <div class="modal-body p-4 bg-light">
        <div class="row g-3">
            <div class="col-md-8">
                <label class="form-label small fw-bold text-secondary">Produkt</label>
                {{ form.product }}
            </div>
            <div class="col-md-4">
                <label class="form-label small fw-bold text-secondary">Status</label>
                {{ form.status }}
            </div>

            <div class="col-12">
                <label class="form-label small fw-bold text-secondary">Dostawca</label>
                {{ form.supplier }}
            </div>

            <div class="col-md-4">
                <label class="form-label small fw-bold text-secondary">Ilość sztuk</label>
                {{ form.quantity }}
            </div>

            <div class="col-md-4">
                <label class="form-label small fw-bold text-secondary text-success">Cena Netto</label>
                <div class="input-group">
                    {{ form.net_price }}
                    <span class="input-group-text small">PLN</span>
                </div>
            </div>
            <div class="col-md-4">
                <label class="form-label small fw-bold text-secondary text-primary">Cena Brutto</label>
                <div class="input-group">
                    {{ form.gross_price }}
                    <span class="input-group-text small">PLN</span>
                </div>
            </div>

            <div id="vat-info" class="col-12 mt-2">
                <div class="badge bg-secondary opacity-75 fw-normal p-2 w-100 text-start">
                    <i class="bi bi-percent me-1"></i> Stawka VAT produktu: <span id="current-vat">0</span>%
                </div>
            </div>
        </div>
    </div>

    <div class="modal-footer bg-white px-4">
        <button type="button" class="btn btn-link text-muted text-decoration-none" data-bs-dismiss="modal">Anuluj</button>
        <button type="submit" class="btn btn-primary px-4 shadow-sm">Zapisz zamówienie</button>
    </div>
</form>

<script>
    // Funkcja inicjalizująca logikę formularza
    (function() {
        const productSelect = document.getElementById('id_product');
        const netInput = document.getElementById('id_net_price');
        const grossInput = document.getElementById('id_gross_price');
        const vatSpan = document.getElementById('current-vat');

        // Mapa stawek VAT przekazana z Formularza
        const productVats = {{ form.product_vats|safe|default:"{}" }};
        let activeVat = 0;

        function updateVatRate() {
            const productId = productSelect.value;
            activeVat = parseFloat(productVats[productId]) || 0;
            if (vatSpan) vatSpan.innerText = activeVat;
        }

        function recalculateFromNet() {
            const net = parseFloat(netInput.value);
            if (!isNaN(net)) {
                const gross = net * (1 + activeVat / 100);
                grossInput.value = gross.toFixed(2);
            }
        }

        function recalculateFromGross() {
            const gross = parseFloat(grossInput.value);
            if (!isNaN(gross)) {
                const net = gross / (1 + activeVat / 100);
                netInput.value = net.toFixed(2);
            }
        }

        // Eventy dla pól cen
        netInput.addEventListener('input', recalculateFromNet);
        grossInput.addEventListener('input', recalculateFromGross);

        // Event dla zmiany produktu
        productSelect.addEventListener('change', function() {
            updateVatRate();
            recalculateFromNet(); // Przelicz brutto na podstawie nowego VATu
        });

        // INICJALIZACJA NATYCHMIASTOWA (dla HTMX)
        // Wykonujemy od razu po wstrzyknięciu kodu do DOM
        updateVatRate();

        // Obsługa specyficzna dla Twojego filtrowania produktów (HTMX hx-get na liście produktów)
        document.body.addEventListener('htmx:afterOnLoad', function(evt) {
            // Jeśli element, który właśnie został podmieniony to nasz select produktu
            if (evt.detail.target.id === 'id_product') {
                updateVatRate();
            }
        });
    })();
</script>
