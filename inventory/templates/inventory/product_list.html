{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="h4 mb-0"><i class="bi bi-box-seam me-2"></i>Produkty</h2>
    <button class="btn btn-primary"
            hx-get="{% url 'product_create' %}"
            hx-target="#modal-content"
            data-bs-toggle="modal"
            data-bs-target="#productModal">
        <i class="bi bi-plus-lg me-2"></i>Dodaj Produkt
    </button>
</div>

<div id="bulk-actions" class="alert alert-info py-2 mb-3 d-none shadow-sm border-info d-flex justify-content-between align-items-center">
    <div>
        <i class="bi bi-check2-square me-2"></i>Zaznaczono: <span id="selected-count" class="fw-bold">0</span> produktów
    </div>
    <div class="btn-group">
        <button class="btn btn-sm btn-danger"
                hx-post="{% url 'product_bulk_delete' %}"
                hx-target="#product-table-container"
                hx-include=".product-checkbox"
                hx-confirm="Czy na pewno chcesz usunąć zaznaczone produkty?">
            <i class="bi bi-trash me-1"></i>Usuń zaznaczone
        </button>
    </div>
</div>

{% include 'inventory/partials/filter_bar.html' %}

<div id="product-table-container"
     hx-get="{% url 'product_list' %}"
     hx-trigger="productChanged from:body">
    {% include 'inventory/partials/product_table.html' %}
</div>

<script>
    // Funkcja aktualizująca widoczność paska akcji zbiorczych
    function updateBulkActionsBar() {
        const checkedCount = document.querySelectorAll('.product-checkbox:checked').length;
        const bulkBar = document.getElementById('bulk-actions');
        const countSpan = document.getElementById('selected-count');

        if (bulkBar && countSpan) {
            if (checkedCount > 0) {
                bulkBar.classList.remove('d-none');
                bulkBar.classList.add('d-flex'); // Bootstrap d-flex gryzie się z d-none
                countSpan.innerText = checkedCount;
            } else {
                bulkBar.classList.add('d-none');
                bulkBar.classList.remove('d-flex');
            }
        }
    }

    // 1. Obsługa zmian w checkboxach (używamy delegacji na body)
    document.body.addEventListener('change', function(e) {
        if (e.target.classList.contains('product-checkbox') || e.target.id === 'select-all-products') {
            // Jeśli kliknięto "zaznacz wszystko", zsynchronizuj resztę
            if (e.target.id === 'select-all-products') {
                const checkboxes = document.querySelectorAll('.product-checkbox');
                checkboxes.forEach(cb => cb.checked = e.target.checked);
            }
            updateBulkActionsBar();
        }
    });

    // 2. KLUCZOWE: Reset po operacji HTMX (np. usunięciu)
    // Słuchamy sygnału 'productChanged', który wysyłasz z views.py
    document.body.addEventListener('productChanged', function() {
        const bulkBar = document.getElementById('bulk-actions');
        const selectAll = document.getElementById('select-all-products');

        // Ukrywamy pasek
        if (bulkBar) {
            bulkBar.classList.add('d-none');
            bulkBar.classList.remove('d-flex');
        }

        // Resetujemy główny checkbox (jeśli istnieje po przeładowaniu tabeli)
        if (selectAll) {
            selectAll.checked = false;
        }

        // Resetujemy licznik w pamięci
        const countSpan = document.getElementById('selected-count');
        if (countSpan) countSpan.innerText = '0';
    });
</script>
{% endblock %}
