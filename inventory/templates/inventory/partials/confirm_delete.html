<div class="modal-header bg-danger text-white">
    <h5 class="modal-title">Potwierdź usunięcie</h5>
    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
</div>
<form hx-post="{% url 'product_delete' product.id %}" hx-target="#modal-content">
    {% csrf_token %}
    <div class="modal-body text-center py-4">
        <p>Czy na pewno chcesz usunąć produkt: <strong>{{ product.name }}</strong>?</p>
        <p class="text-danger small"><i class="bi bi-exclamation-triangle me-1"></i> Tej operacji nie można cofnąć.</p>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Anuluj</button>
        <button type="submit" class="btn btn-danger">Usuń produkt</button>
    </div>
</form>
