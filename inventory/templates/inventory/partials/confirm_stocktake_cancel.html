<div class="modal-header">
    <h5 class="modal-title text-danger fw-bold"><i class="bi bi-x-circle me-2"></i>Anulowanie inwentaryzacji</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Zamknij"></button>
</div>

<form method="post" action="{% url 'stocktake_cancel' stocktake.id %}">
    {% csrf_token %}
    <div class="modal-body text-center py-4">
        <i class="bi bi-clipboard-x text-danger display-4 mb-3 d-block"></i>
        <h5 class="fw-bold">Czy na pewno chcesz anulować tę inwentaryzację?</h5>
        <p class="text-muted mb-0">
            Arkusz inwentaryzacyjny zostanie oznaczony jako anulowany. Żadne stany magazynowe nie zostaną zmienione.
        </p>
    </div>
    <div class="modal-footer bg-light">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Wróć</button>
        <button type="submit" class="btn btn-danger fw-semibold">
            <i class="bi bi-x-lg me-1"></i>Tak, anuluj inwentaryzację
        </button>
    </div>
</form>
