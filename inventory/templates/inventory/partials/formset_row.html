{% if prefix == 'suppliers' %}
    <div class="row g-2 mb-2 align-items-end border-bottom pb-2 animate__animated animate__fadeIn" data-formset-row="suppliers">
        {{ form.id }}
        <div class="col-6">
            <label class="tiny-label text-muted mb-1">Dostawca</label>
            {{ form.supplier }}
        </div>
        <div class="col-4">
            <label class="tiny-label text-muted mb-1">Kod SKU</label>
            {{ form.supplier_sku }}
        </div>
        <div class="col-2 text-center pb-1">
            <button type="button" class="btn btn-sm btn-outline-danger" onclick="removeRow(this, 'suppliers')">
                <i class="bi bi-trash"></i>
            </button>
        </div>
    </div>
{% else %}
    <div class="row g-2 mb-2 align-items-end border-bottom pb-2 batch-row animate__animated animate__fadeIn" data-formset-row="batches">
        {{ form.id }}
        <div class="col-3">
            <label class="tiny-label text-muted mb-1">Ilość</label>
            {{ form.current_stock }}
        </div>
        <div class="col-3">
            <label class="tiny-label text-muted mb-1">Netto</label>
            {{ form.net_price }}
        </div>
        <div class="col-3">
            <label class="tiny-label text-muted mb-1">Brutto</label>
            {{ form.gross_price }}
        </div>
        <div class="col-2 text-center pb-1">
            <button type="button" class="btn btn-sm btn-outline-danger" onclick="removeRow(this, 'batches')">
                <i class="bi bi-trash"></i>
            </button>
        </div>
    </div>
{% endif %}
