<div class="table-responsive shadow-sm rounded border bg-white">
    <table class="table align-middle table-hover mb-0">
        <thead class="table-light">
            <tr>
                <th style="width: 40px;"><input type="checkbox" id="select-all-products" class="form-check-input"></th>

                <th>
                    <a href="#" class="text-decoration-none text-dark d-flex align-items-center"
                       hx-get="{% url 'product_list' %}?sort=name&direction={% if current_sort == 'name' and current_direction == 'asc' %}desc{% else %}asc{% endif %}&{{ current_filters_params }}"
                       hx-target="#product-table-container">
                        Nazwa produktu
                        <i class="bi bi-caret-{% if current_sort == 'name' %}{% if current_direction == 'asc' %}up{% else %}down{% endif %}-fill text-primary{% else %}up text-muted small ms-1{% endif %}"></i>
                    </a>
                </th>

                <th class="text-center">Stan magazynowy</th>

                <th class="text-center">
                    <a href="#" class="text-decoration-none text-dark d-flex align-items-center justify-content-center"
                       hx-get="{% url 'product_list' %}?sort=stock&direction={% if current_sort == 'stock' and current_direction == 'asc' %}desc{% else %}asc{% endif %}&{{ current_filters_params }}"
                       hx-target="#product-table-container">
                        Stan suma
                        <i class="bi bi-caret-{% if current_sort == 'stock' %}{% if current_direction == 'asc' %}up{% else %}down{% endif %}-fill text-primary{% else %}up text-muted small ms-1{% endif %}"></i>
                    </a>
                </th>

                <th class="text-center">Status</th>
                <th>Dostawcy / SKU</th>
                <th class="text-end" style="min-width: 120px;">Akcje</th>
            </tr>
        </thead>
        <tbody>
            {% for p in products %}
                {% include 'inventory/partials/product_row.html' %}
            {% empty %}
            <tr><td colspan="7" class="text-center py-5 text-muted">Brak produktów spełniających kryteria.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<script>
    // Inicjalizacja logiki checkboxów po załadowaniu partiala
    (function() {
        const selectAll = document.getElementById('select-all-products');
        const bulkBtn = document.getElementById('bulk-add-btn');
        const countSpan = document.getElementById('selected-count');

        if (selectAll) {
            selectAll.addEventListener('change', function() {
                const checkboxes = document.querySelectorAll('.product-checkbox');
                checkboxes.forEach(cb => cb.checked = selectAll.checked);
                updateBulkBtn();
            });
        }

        document.addEventListener('change', function(e) {
            if (e.target.classList.contains('product-checkbox')) {
                updateBulkBtn();
            }
        });

        function updateBulkBtn() {
            const activeCount = document.querySelectorAll('.product-checkbox:checked').length;
            if (bulkBtn) {
                bulkBtn.style.display = activeCount > 0 ? 'block' : 'none';
                countSpan.innerText = activeCount;
            }
        }
    })();
</script>
