<div class="table-responsive bg-white rounded-3 shadow-sm border">
    <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
            <tr>
                <th class="ps-4" style="width: 40%;">Nazwa usługi</th>
                <th class="text-center" style="width: 15%;">VAT (%)</th>
                <th class="text-end" style="width: 15%;">Cena Netto</th>
                <th class="text-end" style="width: 15%;">Cena Brutto</th>
                <th class="text-end pe-4" style="width: 15%;">Akcje</th>
            </tr>
        </thead>
        <tbody>
            {% for service in services %}
            <tr>
                <td class="ps-4">
                    <div class="fw-bold text-dark">{{ service.name }}</div>
                </td>
                <td class="text-center">
                    <span class="badge bg-light text-secondary border px-2 py-1" style="font-size: 0.85rem;">
                        {{ service.vat_rate }}%
                    </span>
                </td>
                <td class="text-end">
                    <span class="text-muted">{{ service.net_price }}</span> <small class="text-muted">PLN</small>
                </td>
                <td class="text-end">
                    <div class="fw-bold text-primary" style="font-size: 1.05rem;">
                        {{ service.gross_price }} <span style="font-size: 0.8rem;">PLN</span>
                    </div>
                </td>
                <td class="text-end pe-4">
                    <div class="btn-group btn-group-sm border rounded bg-white shadow-sm">
                        <button class="btn btn-white text-secondary border-end px-2"
                                hx-get="{% url 'service_edit' service.id %}"
                                hx-target="#modal-content"
                                data-bs-toggle="modal"
                                data-bs-target="#serviceModal"
                                title="Edytuj">
                            <i class="bi bi-pencil-square"></i>
                        </button>
                        <button class="btn btn-white text-danger px-2"
                                hx-post="{% url 'service_delete' service.id %}"
                                hx-confirm="Czy na pewno chcesz usunąć usługę: {{ service.name }}?"
                                hx-swap="none"
                                title="Usuń">
                            <i class="bi bi-trash3"></i>
                        </button>
                    </div>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="5" class="text-center py-5">
                    <div class="text-muted mb-2"><i class="bi bi-tools fs-1"></i></div>
                    <div class="text-secondary fw-bold">Twój cennik jest pusty</div>
                    <div class="text-muted small">Dodaj pierwszą usługę, aby zacząć budować kosztorysy.</div>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
