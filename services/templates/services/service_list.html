{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="h4 mb-0">Cennik Usług</h2>
    <button class="btn btn-primary" hx-get="{% url 'service_create' %}" hx-target="#modal-content" data-bs-toggle="modal" data-bs-target="#serviceModal">
        <i class="bi bi-plus-lg me-2"></i>Dodaj usługę
    </button>
</div>

<div class="card border-0 shadow-sm mb-4">
    <div class="card-body">
        <div class="row g-3">
            <div class="col-md-8">
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                    <input type="text" name="search" class="form-control border-start-0 ps-0"
                           placeholder="Szukaj usługi..." hx-get="{% url 'service_list' %}"
                           hx-trigger="keyup changed delay:500ms" hx-target="#service-table-container">
                </div>
            </div>
            <div class="col-md-4">
                <select name="sort" class="form-select" hx-get="{% url 'service_list' %}" hx-target="#service-table-container">
                    <option value="name">Sortuj: Nazwa (A-Z)</option>
                    <option value="-name">Sortuj: Nazwa (Z-A)</option>
                    <option value="net_price">Sortuj: Cena rosnąco</option>
                    <option value="-net_price">Sortuj: Cena malejąco</option>
                </select>
            </div>
        </div>
    </div>
</div>

<div id="service-table-container" hx-get="{% url 'service_list' %}" hx-trigger="servicesChanged from:body">
    {% include 'services/partials/service_table.html' %}
</div>

<div class="modal fade" id="serviceModal" tabindex="-1">
    <div class="modal-dialog">
        <div id="modal-content" class="modal-content"></div>
    </div>
</div>
{% endblock %}
