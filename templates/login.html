<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Logowanie | Magazyn Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { width: 100%; max-width: 400px; padding: 2rem; border: none; border-radius: 1rem; box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="card login-card bg-white">
        <h3 class="text-center mb-4">Magazyn Pro</h3>

        <form method="post">
            {% csrf_token %}

            {% if form.errors %}
                <div class="alert alert-danger">Błędny login lub hasło.</div>
            {% endif %}

            <div class="mb-3">
                <label class="form-label">Użytkownik</label>
                {{ form.username }}
            </div>

            <div class="mb-3">
                <label class="form-label">Hasło</label>
                {{ form.password }}
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2">Zaloguj się</button>
        </form>
    </div>
</body>
</html>
