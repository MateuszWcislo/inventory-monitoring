<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Magazyn Pro{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body { background-color: #f8f9fa; }
        .navbar-brand { font-weight: bold; color: #0d6efd !important; }
        .modal-content { border: none; border-radius: 12px; }
        .tenant-badge { font-size: 0.75rem; vertical-align: middle; }
        @media (max-width: 991.98px) {
            .navbar-nav { margin-bottom: 1rem; }
            .user-info-section { border-top: 1px solid #495057; padding-top: 1rem; }
        }
    </style>

    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">Magazyn Pro</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                   <li class="nav-item">
                        <a class="nav-link" href="{% url 'product_list' %}"><i class="bi bi-box-seam me-1"></i>Produkty</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'supplier_list' %}"><i class="bi bi-truck me-1"></i>Dostawcy</a>
                    </li>
<!--                    <li class="nav-item">-->
<!--                        <a class="nav-link" href="{% url 'order_list' %}"><i class="bi bi-cart-check me-1"></i>Zamówienia</a>-->
<!--                    </li>-->
<!--                    {% if user.role == 'ADMIN' or user.is_superuser %}-->
<!--                    <li class="nav-item">-->
<!--                        <a class="nav-link text-info" href="{% url 'user_list' %}"><i class="bi bi-people me-1"></i>Użytkownicy</a>-->
<!--                    </li>-->
<!--                    {% endif %}-->
                </ul>

                <div class="user-info-section d-flex flex-column flex-lg-row align-items-start align-items-lg-center">
                    <div class="text-light me-lg-3 mb-3 mb-lg-0 text-start text-lg-end">
                        <small class="d-block text-muted" style="font-size: 0.7rem; text-transform: uppercase;">Firma</small>
                        <span class="fw-bold">{{ user.tenant.name|default:"System" }}</span>
                    </div>
                    <form action="{% url 'logout' %}" method="post" class="d-flex align-items-center border-lg-start ps-lg-3">
                        {% csrf_token %}
                        <span class="navbar-text me-3 text-light small d-none d-sm-inline">Witaj, <strong>{{ user.username }}</strong>!</span>
                        <button type="submit" class="btn btn-outline-danger btn-sm">Wyloguj</button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <div class="modal fade" id="productModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div id="modal-content" class="modal-content shadow">
                <div class="modal-body text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Ładowanie...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1060;">
        <div id="actionToast" class="toast align-items-center text-white bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="toastMessage"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Funkcja do wymuszonego sprzątania po modalu
        function forceCleanupModal() {
            setTimeout(() => {
                document.querySelectorAll('.modal-backdrop').forEach(el => el.remove());
                document.body.classList.remove('modal-open');
                document.body.style.overflow = '';
                document.body.style.paddingRight = '';
            }, 50); // krótkie opóźnienie, aby Bootstrap zdążył przetworzyć zdarzenie
        }

        document.body.addEventListener('htmx:afterOnLoad', function (evt) {
            const triggerHeader = evt.detail.xhr.getResponseHeader('HX-Trigger');
            if (!triggerHeader) return;

            let triggers;
            try {
                triggers = JSON.parse(triggerHeader);
            } catch (e) {
                triggers = { [triggerHeader]: null };
            }

            const closeTriggers = ['productChanged', 'suppliersChanged', 'ordersChanged', 'usersChanged'];
            const shouldClose = Object.keys(triggers).some(t => closeTriggers.includes(t));

            if (shouldClose) {
                const modalElement = document.getElementById('productModal');
                const modalInstance = bootstrap.Modal.getInstance(modalElement);

                if (modalInstance) {
                    modalInstance.hide();
                    forceCleanupModal();
                } else {
                    // Jeśli modalInstance nie istnieje, ale tło jest widoczne
                    forceCleanupModal();
                }
            }

            if (triggers.hasOwnProperty('clearProductChecks')) {
                document.querySelectorAll('input[name="product_ids"]').forEach(cb => cb.checked = false);
                const masterCheck = document.getElementById('selectAll');
                if (masterCheck) masterCheck.checked = false;
            }

            if (triggers.hasOwnProperty('showToast')) {
                const toastEl = document.getElementById('actionToast');
                document.getElementById('toastMessage').innerText = triggers.showToast || "Zapisano pomyślnie!";
                new bootstrap.Toast(toastEl).show();
            }
        });

        // Resetowanie zawartości modala po zamknięciu
        const productModal = document.getElementById('productModal');
        if (productModal) {
            productModal.addEventListener('hidden.bs.modal', function () {
                document.getElementById('modal-content').innerHTML = `
                    <div class="modal-body text-center py-5">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Ładowanie...</span>
                        </div>
                    </div>`;
                // Dodatkowe zabezpieczenie przy ręcznym zamykaniu (np. klawiszem Esc)
                forceCleanupModal();
            });
        }
    </script>

    <script>
        // Słuchamy zdarzenia wysłanego przez serwer
        document.body.addEventListener('productChanged', function() {
            // Znajdź otwarty modal Bootstrapa
            const modalElement = document.getElementById('productModal');
            const modalInstance = bootstrap.Modal.getInstance(modalElement);

            if (modalInstance) {
                modalInstance.hide(); // Zamknij okno
            }
        });
    </script>
</body>
</html>
