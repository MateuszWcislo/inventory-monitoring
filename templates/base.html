<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Magazyn Pro{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body { background-color: #f8f9fa; }
        .navbar-brand { font-weight: bold; color: #0d6efd !important; }
        /* Styl dla płynnego przejścia modala */
        .modal-content { border: none; border-radius: 12px; }
    </style>

    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">Magazyn Pro</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'product_list' %}">Produkty</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'supplier_list' %}">Dostawcy</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'order_list' %}">Zamówienia</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Użytkownicy</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'activity_logs' %}">Logi</a>
                    </li>
                </ul>
                <form action="{% url 'logout' %}" method="post" class="d-flex">
                    {% csrf_token %}
                    <span class="navbar-text me-3 text-light">Witaj, {{ user.username }}!</span>
                    <button type="submit" class="btn btn-outline-danger btn-sm">Wyloguj</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <div class="modal fade" id="productModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div id="modal-content" class="modal-content shadow">
                <div class="modal-body text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Ładowanie...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // 1. Zamykanie modala po sygnale z Django (HX-Trigger)
        document.body.addEventListener('htmx:afterOnLoad', function (evt) {
            if (evt.detail.xhr.getResponseHeader('HX-Trigger') === 'productChanged') {
                const modalElement = document.getElementById('productModal');
                const modalInstance = bootstrap.Modal.getInstance(modalElement);
                if (modalInstance) {
                    modalInstance.hide();
                }
            }
        });

        // 2. Resetowanie zawartości modala do spinnera po zamknięciu
        // Zapobiega "miganiu" starego formularza przy nowym otwarciu
        document.getElementById('productModal').addEventListener('hidden.bs.modal', function () {
            document.getElementById('modal-content').innerHTML = `
                <div class="modal-body text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Ładowanie...</span>
                    </div>
                </div>`;
        });
    </script>

   <script>
    document.body.addEventListener('htmx:afterOnLoad', function (evt) {
        const trigger = evt.detail.xhr.getResponseHeader('HX-Trigger');

        // Tablica sygnałów, które mają zamknąć modal 📋
        const closeTriggers = ['productChanged', 'suppliersChanged', 'ordersChanged'];

        if (closeTriggers.includes(trigger)) {
            const modalElement = document.getElementById('productModal');
            const modalInstance = bootstrap.Modal.getInstance(modalElement);
            if (modalInstance) {
                modalInstance.hide();
            }
            // Sprzątanie tła 🧹
            document.querySelectorAll('.modal-backdrop').forEach(el => el.remove());
            document.body.classList.remove('modal-open');
            document.body.style.overflow = 'auto';
        }
    });
    </script>
</body>
</html>
